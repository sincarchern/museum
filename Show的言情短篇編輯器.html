["雨夜老書店","老書店","那天夜裡雨下得很固執，{P}的燈是整條街上唯一亮著的，像一句沒說完的話。"],

["山上老民宿","山上的民宿","霧把{P}整個吞了進去，連鳥叫聲都顯得遙遠，彷彿世界只剩這幾間亮著燈的屋子。"],

{k:"t",t:"相遇",o:[
["借傘","{F}忘了帶傘，站在屋簷下發愁，一把傘忽然從旁邊遞了過來。「我不急。」{M}說完就走進雨裡，連名字都沒留。"],

["十年後重逢","他們是在十年後重逢的。{F}一眼就認出了{M}，而{M}沉默了很久，才說：「你一點都沒變。」「你騙人。」{F}說，眼眶卻先紅了。"],
["被迫合作","一個臨時的專案把兩個互相看不順眼的人綁在了一起。{F}嫌{M}太慢，{M}嫌{F}太急，吵到最後，竟然都笑了。"],
["搶最後一個位子","最後一個空位只剩一個，{F}和{M}同時走了過去，又同時停下。「你先坐。」「不，你坐。」僵持了半天，兩人終於一起笑了。"],

{k:"o",t:"信物",o:[

["舊車票","那張舊車票","舊車票","{O}被夾在書頁之間，邊角已經磨白，上面的日期是一個誰都沒有說破的紀念日。"],

{k:"b",t:"阻礙",o:[

["自尊","他們都太驕傲了，驕傲到寧可沉默，也不願承認自己在意。日子一天一天過去，話被留在喉嚨裡發酸。"],

["事業與愛情","一個難得的機會擺在眼前，要走，就得離開這裡；要留，就得放下夢想。他們誰也不願為了對方放棄自己。"],

var S={};
var $=function(i){return document.getElementById(i)};
function build(){
 var h=$("groups");
 D.forEach(function(g){
  var fs=document.createElement("fieldset"),lg=document.createElement("legend"),c=document.createElement("div");
  lg.textContent=g.t;c.className="chips";
  g.o.forEach(function(o,i){
   var b=document.createElement("button");
   b.className="chip";b.textContent=o[0];b.setAttribute("aria-pressed","false");b.dataset.k=g.k;b.dataset.i=i;
   b.onclick=function(){S[g.k]=i;sync();render()};
   c.appendChild(b)});
  fs.appendChild(lg);fs.appendChild(c);h.appendChild(fs);
  S[g.k]=0});
 sync();
}
function sync(){
 document.querySelectorAll(".chip").forEach(function(b){
  b.setAttribute("aria-pressed",S[b.dataset.k]==b.dataset.i?"true":"false")})}
function pick(k){return D.filter(function(g){return g.k==k})[0].o[S[k]]}
function fill(t,v){return t.replace(/\{F\}/g,v.F).replace(/\{M\}/g,v.M).replace(/\{P\}/g,v.P).replace(/\{O\}/g,v.O)}
var text="";
function render(){
 musSwitch();var s=pick("s"),o=pick("o");
 var v={F:$("nf").value.trim()||"她",M:$("nm").value.trim()||"他",P:s[1],O:o[1]};
 var paras=[fill(pick("g")[1],v)+fill(s[2],v),fill(pick("f")[1],v)+fill(pick("m")[1],v),fill(pick("t")[1],v),fill(pick("u")[1],v),fill(o[3],v),fill(pick("b")[1],v),fill(pick("r")[1],v),fill(pick("e")[1],v)];
 var title="《"+o[2]+"》";
 var tags=["v","g","f","m","s","t","u","o","b","r","e"].map(function(k){return pick(k)[0]});
 var el=$("story");
 el.innerHTML="";
 var bn=document.createElement("div");bn.className="banner "+pick("v")[1];var h=document.createElement("h2");h.textContent=title;bn.appendChild(h);var by=document.createElement("div");by.className="by";by.textContent="文：Show";bn.appendChild(by);el.appendChild(bn);
 var tg=document.createElement("p");tg.className="tags";
 tags.forEach(function(t){var sp=document.createElement("span");sp.className="tag";sp.textContent=t;tg.appendChild(sp)});
 el.appendChild(tg);
 paras.forEach(function(p){var e=document.createElement("p");e.textContent=p;el.appendChild(e)});
 var kw="配樂建議："+pick("u")[2];var fp=document.createElement("p");fp.className="kw";fp.textContent=kw;el.appendChild(fp);
 text=title+"\n文：Show\n\n"+paras.join("\n\n")+"\n\n"+kw;
}
function setTh(v){var r=document.documentElement;if(v=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",v);document.querySelectorAll("[data-th]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.th==v?"true":"false")});try{localStorage.setItem("th",v)}catch(e){}}
document.querySelectorAll("[data-th]").forEach(function(b){b.onclick=function(){setTh(b.dataset.th)}});
var t0="auto";try{t0=localStorage.getItem("th")||"auto"}catch(e){}setTh(t0);
var AC,master,NB,timer,nextT=0,stp=0,playing=false,lastU=-1;
function mf(n){return 440*Math.pow(2,(n-69)/12)}
function tone(n,t,d,type,g,lp,a){a=a||.01;var o=AC.createOscillator(),e=AC.createGain(),f=AC.createBiquadFilter();o.type=type;o.frequency.value=mf(n);f.type="lowpass";f.frequency.value=lp||3000;e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(g,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(e);e.connect(master);o.start(t);o.stop(t+d+.05)}
function hat(t,g){var b=AC.createBufferSource(),f=AC.createBiquadFilter(),e=AC.createGain();b.buffer=NB;f.type="highpass";f.frequency.value=6000;e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.0001,t+.05);b.connect(f);f.connect(e);e.connect(master);b.start(t);b.stop(t+.06)}
var ST=[
{bpm:60,ch:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],p:function(s,c,t){if(s==0)tone(c[0]-24,t,3.5,"sine",.22,800);if(s%2==0)tone(c[(s/2)%3]+12,t,2.4,"triangle",.16,2400);if(s==6)tone(c[2]+24,t,2,"sine",.07,3000)}},
{bpm:84,ch:[[62,65,69,72],[59,62,65,67],[60,64,67,71],[61,64,67,69]],p:function(s,c,t,sd){if(s%2)t+=sd*.33;if(s%2==0)tone(c[(s/2)%4]-24,t,.5,"triangle",.3,700);if(s==3||s==6)c.forEach(function(n){tone(n,t,.35,"triangle",.07,1800)});if(s%2==0)hat(t,.03)}},
{bpm:76,ch:[[55,59,62],[52,55,59],[48,52,55],[50,54,57]],p:function(s,c,t){var P=[0,2,1,2,0,2,1,2];if(s==0)tone(c[0]-12,t,1.2,"triangle",.25,600);tone(c[P[s]]+12,t,.9,"sawtooth",.07,1700)}},
{bpm:68,ch:[[60,64,67],[57,60,64],[62,65,69],[55,59,62]],p:function(s,c,t,sd,bar){if(s==0)c.forEach(function(n){tone(n,t,3.6,"sine",.07,1300,.5)});if(s==0||s==3||s==6)tone(c[(Math.floor(s/3)+bar)%3]+12,t,1.4,"triangle",.1,2000);if(Math.random()<.25)hat(t,.02)}},
{bpm:104,ch:[[65,69,72,76],[64,67,71,74],[62,65,69,72],[60,64,67,71]],p:function(s,c,t){tone(c[0]-24+(s%2?12:0),t,.22,"sawtooth",s%2?.1:.2,500);if(s==0||s==3||s==6)c.forEach(function(n){tone(n,t,.3,"sawtooth",.04,2200)});hat(t,.03)}}
];
function sched(){var st=ST[S.u],sd=60/st.bpm/2;while(nextT<AC.currentTime+.3){var bar=Math.floor(stp/8);st.p(stp%8,st.ch[bar%4],nextT,sd,bar);nextT+=sd;stp++}}
function musSwitch(){if(playing&&AC&&lastU!==S.u){stp=0;nextT=AC.currentTime+.1}lastU=S.u}
$("mus").onclick=function(){
 var b=$("mus"),m=$("msg");
 if(playing){playing=false;clearInterval(timer);master.gain.setTargetAtTime(0,AC.currentTime,.15);b.textContent="♪ 播放配樂";m.textContent="";return}
 try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);NB=AC.createBuffer(1,Math.floor(AC.sampleRate/10),AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  AC.resume();master.gain.cancelScheduledValues(0);master.gain.setValueAtTime(.8,AC.currentTime);
  stp=0;nextT=AC.currentTime+.1;lastU=S.u;playing=true;timer=setInterval(sched,100);
  b.textContent="■ 停止配樂";m.textContent="配樂為即時合成的簡易音色，會隨「配樂」選項切換；手機請確認未開靜音。"
 }catch(e){m.textContent="此瀏覽器無法播放音訊"}
};
$("rand").onclick=function(){D.forEach(function(g){S[g.k]=Math.floor(Math.random()*g.o.length)});sync();render()};
$("copy").onclick=function(){
 var m=$("msg");
 function ok(){m.textContent="已複製全文"}
 function no(){m.textContent="複製失敗，請手動選取右側文字"}
 try{navigator.clipboard.writeText(text).then(ok,no)}catch(e){no()}};
$("nf").oninput=render;$("nm").oninput=render;
build();render();
