<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>節氣時鐘</title>
<style>
:root{color-scheme:dark;--c1:#1d2b3a;--c2:#0b121a;--ac:#bcd;--tx:#eef2f0;--dim:rgba(238,242,240,.62);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;color:var(--tx);background:linear-gradient(160deg,var(--c1),var(--c2)) fixed;background-color:var(--c2);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;display:flex;flex-direction:column;align-items:center;padding:20px 18px 32px;overflow-x:hidden}
.clock{font-size:14px;letter-spacing:.25em;color:var(--dim);margin-top:6px}
.wrap{position:relative;width:min(88vw,340px);aspect-ratio:1;margin:18px 0 8px}
svg{width:100%;height:100%;display:block}
.dot{cursor:pointer;transition:r .4s,fill .4s}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.name{font-size:clamp(52px,17vw,72px);letter-spacing:.12em;margin-right:-.12em;color:var(--ac);font-weight:600;line-height:1.1;transition:color .6s}
.sub{font-size:13px;color:var(--dim);letter-spacing:.2em;margin-top:6px}
.card{max-width:340px;width:100%;text-align:center}
.hou{font-size:13px;letter-spacing:.3em;color:var(--ac);margin:10px 0 14px}
.line{font-size:20px;line-height:1.8;margin:0}
.au{font-size:13px;color:var(--dim);margin-top:4px;min-height:1.2em}
.bar{height:3px;background:rgba(255,255,255,.14);border-radius:2px;margin:22px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .8s}
.meta{font-size:13px;color:var(--dim);letter-spacing:.08em}
button{margin-top:18px;background:none;border:1px solid var(--ac);color:var(--ac);font:inherit;font-size:13px;letter-spacing:.2em;padding:8px 20px;border-radius:20px;cursor:pointer;display:none}
.note{font-size:11px;color:var(--dim);margin-top:26px;opacity:.7;text-align:center}
.credit{position:relative;z-index:1;font-size:12px;letter-spacing:.3em;color:var(--ac);margin-top:18px;opacity:.85;text-align:center}
.date{font-size:15px;letter-spacing:.14em;margin-top:8px;text-align:center;line-height:1.7;position:relative;z-index:1}
.date small{display:block;font-size:13px;color:var(--dim);letter-spacing:.2em}
.nav{display:flex;align-items:center;justify-content:space-between;width:min(88vw,340px);position:relative;z-index:1;font-size:12px;color:var(--dim);letter-spacing:.15em}
.arr{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0;padding:0;font-size:24px;border-radius:50%}
#bk{min-height:44px}
#sc,#cl{display:inline-block;min-height:44px}
#sc,#bk{margin-inline:4px}
.lnk{display:inline-flex;align-items:center;min-height:44px;margin-top:14px;padding:0 22px;border:1px solid var(--ac);border-radius:22px;color:var(--ac);font-size:13px;letter-spacing:.2em;text-decoration:none}
.lnk:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
#ov{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#ov[hidden]{display:none}
#ov img{max-width:100%;max-height:76dvh;border-radius:8px}
#ov .hint{font-size:13px;color:var(--dim);letter-spacing:.15em}
#vol{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);right:12px;z-index:4;width:112px;accent-color:var(--ac);display:none}
.dtl{text-align:left;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16);font-size:14px;line-height:1.95}
.dtl p{margin:0 0 8px}
.dtl .k{color:var(--ac);letter-spacing:.15em;font-size:12px;margin-right:.6em}
.dtl .s{color:var(--dim);font-size:13px}
.date small.fe{color:var(--ac)}
.fes{max-width:340px;width:100%;text-align:left;margin-top:28px;position:relative;z-index:1;font-size:14px;line-height:1.8}
.fes h3{font-size:12px;letter-spacing:.3em;color:var(--ac);margin:0 0 10px;font-weight:400}
.fes p{margin:0 0 12px;border-left:2px solid var(--ac);padding-left:10px}
.fes b{display:block;font-weight:600}
.fes span{display:block;font-size:12px;color:var(--dim)}
.fes i{display:block;font-style:normal;font-size:13px}
.fes em{display:block;font-style:normal;font-size:11px;color:var(--dim);opacity:.8;margin-top:6px}
.name.fade{animation:nf .9s cubic-bezier(.2,.7,.2,1)}
@keyframes nf{from{opacity:0;transform:scale(.92);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){.fade,.name.fade{animation:none}}
button:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
svg g:focus-visible{outline:none}
svg g:focus-visible .dot{stroke:#fff;stroke-width:2}
.mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:4;display:inline-flex;align-items:center;margin:0;min-height:44px;padding:0 14px;background:rgba(0,0,0,.28)}
.fade{animation:f .7s}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.clock,.card,.note{position:relative;z-index:1}
.ly{font-size:14px;line-height:1.8;color:var(--ac);margin-top:12px;letter-spacing:.06em}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.poem-panel{width:min(92vw,380px);margin:26px 0 8px;position:relative;z-index:1;border:1px solid rgba(255,255,255,.16);border-radius:18px;overflow:hidden;background:rgba(5,12,18,.26);box-shadow:0 14px 36px rgba(0,0,0,.16)}
.poem-head{font-size:11px;letter-spacing:.32em;color:var(--ac);text-align:center;padding:17px 12px 10px}
.poem-art{height:174px;overflow:hidden;background:linear-gradient(180deg,#243b46,#14252c)}
.poem-art svg{width:100%;height:100%;display:block}
.poem-copy{padding:18px 20px 20px;text-align:center}
.poem-verse{font-size:19px;line-height:1.95;letter-spacing:.08em;white-space:pre-line;color:#f0eadb}
.poem-author{font-size:12px;letter-spacing:.15em;color:var(--ac);margin-top:9px}
.poem-note{font-size:13px;line-height:1.85;color:var(--dim);margin:12px 0 0}
.poem-tag{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-top:14px}
@media(min-width:700px){.poem-panel{width:min(92vw,430px)}.poem-art{height:205px}}

</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="mus" id="mus" aria-pressed="false">♪ 音樂　關</button>
<input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" aria-label="音量">
<div class="clock" id="clk"></div>
<div class="date" id="dt"></div>
<div class="wrap">
  <svg viewBox="0 0 320 320" id="ring" role="img" aria-label="二十四節氣環"></svg>
  <div class="center"><div class="name fade" id="nm" aria-live="polite"></div><div class="sub" id="sb"></div></div>
</div>
<div class="nav"><button class="arr" id="pv" aria-label="上一個節氣">‹</button><span>滑動、點圓點或用方向鍵切換</span><button class="arr" id="nt" aria-label="下一個節氣">›</button></div>
<div class="card">
  <div class="hou fade" id="hou"></div>
  <p class="line fade" id="ln"></p>
  <div class="au" id="au"></div>
  <div class="ly" id="ly"></div>
  <div class="dtl fade" id="dtl"></div>
  <section class="poem-panel" aria-label="節氣古詩與意境插畫">
    <div class="poem-head">節氣詩畫　·　古典意境</div>
    <div class="poem-art" id="poemArt" aria-hidden="true"></div>
    <div class="poem-copy"><div class="poem-verse" id="poemVerse"></div><div class="poem-author" id="poemAuthor"></div><p class="poem-note" id="poemNote"></p><div class="poem-tag" id="poemTag">二十四節氣・二十四種風景</div></div>
  </section>
  <div class="bar"><i id="pg"></i></div>
  <div class="meta" id="mt"></div>
  <button id="bk">回到今天</button><button id="sc">分享卡片</button>
  <div><a class="lnk" href="https://sincarchern.github.io/museum/神諭卡｜節氣・五行・詩詞.html" target="_blank" rel="noopener">抽一張神諭卡 ›</a></div>
</div>
<div class="fes" id="fes"></div>
<div class="note">夏至在上，冬至在下。環上圓點的顏色是五行。大寒、穀雨、大暑、霜降屬土（土旺）。節氣日期依太陽黃經天文計算，以台北時間為準。PageUp／PageDown 以一季為單位切換，數字鍵 1–4 跳到立春、立夏、立秋、立冬。</div>
<div class="credit">小路_Joseph 工作室製作</div>
<div id="ov" hidden><img id="im" alt="節氣分享卡片"><div class="hint">長按圖片即可儲存或分享</div><button id="cl">關閉</button></div>
<script>
const T=[
["小寒",1,5,"雁北鄉","雁向北方試探，冷是春的前奏。","",220],
["大寒",1,20,"雞始乳","最冷的時候，雞先孵出第一窩暖。","",210],
["立春",2,4,"東風解凍","春風又綠江南岸","王安石",165],
["雨水",2,19,"獺祭魚","好雨知時節，當春乃發生","杜甫",150],
["驚蟄",3,5,"桃始華","微雨眾卉新，一雷驚蟄始","韋應物",135],
["春分",3,20,"玄鳥至","春分雨腳落如麻","查慎行",120],
["清明",4,5,"桐始華","清明時節雨紛紛","杜牧",105],
["穀雨",4,20,"萍始生","浮萍一點，是春天最後的落款。","",90],
["立夏",5,5,"螻蟈鳴","綠樹陰濃夏日長","高駢",140],
["小滿",5,21,"苦菜秀","苦菜初秀，麥穗將滿未滿，最是好時光。","",70],
["芒種",6,5,"螳螂生","螳螂初生，田裡的人影比日頭更忙。","",50],
["夏至",6,21,"鹿角解","一年之中，白晝在此刻抵達盡頭。","",35],
["小暑",7,7,"溫風至","溫風吹過，蟬聲把午後拉得很長。","",20],
["大暑",7,22,"腐草為螢","腐草化螢，暑氣最盛處也有微光。","",10],
["立秋",8,7,"涼風至","一葉落知天下秋","",30],
["處暑",8,23,"鷹乃祭鳥","鷹祭鳥，暑氣在此收攏。","",40],
["白露",9,7,"鴻雁來","蒹葭蒼蒼，白露為霜","《詩經》",195],
["秋分",9,23,"雷始收聲","雷聲收起，晝夜平分，各得一半。","",25],
["寒露",10,8,"鴻雁來賓","鴻雁來賓，露水涼得像舊事。","",15],
["霜降",10,23,"豺乃祭獸","月落烏啼霜滿天","張繼",280],
["立冬",11,7,"水始冰","水始冰，地始凍，人間添一盞燈。","",240],
["小雪",11,22,"虹藏不見","晚來天欲雪，能飲一杯無","白居易",225],
["大雪",12,7,"鶡鴠不鳴","孤舟蓑笠翁，獨釣寒江雪","柳宗元",215],
["冬至",12,22,"蚯蚓結","天時人事日相催，冬至陽生春又來","杜甫",260]
];
const $=id=>document.getElementById(id);
const now=new Date(),Y=now.getFullYear();
const sunLon=j=>{const u=(j-2451545)/36525,r=Math.PI/180,L=280.46646+36000.76983*u+3.032e-4*u*u,M=(357.52911+35999.05029*u-1.537e-4*u*u)*r,C=(1.914602-.004817*u)*Math.sin(M)+(.019993-1.01e-4*u)*Math.sin(2*M)+2.89e-4*Math.sin(3*M),O=(125.04-1934.136*u)*r;return((L+C-.00569-.00478*Math.sin(O))%360+360)%360};
const _c={};
const st=(i,y)=>{
  const k=i+"-"+y;if(_c[k])return _c[k];
  const tg=(285+15*i)%360,a=Date.UTC(y,T[i][1]-1,T[i][2])/864e5+2440587.5,f=j=>((sunLon(j)-tg+540)%360)-180;
  let lo=a-3,hi=a+3;
  for(let n=0;n<40;n++){const m=(lo+hi)/2;if(f(m)<0)lo=m;else hi=m}
  const d=new Date(((lo+hi)/2-2440587.5)*864e5+8*36e5);
  return _c[k]=new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
};
let cur=23,cy=Y-1;
for(let i=0;i<24;i++)if(st(i,Y)<=now){cur=i;cy=Y;}
const nx=(cur+1)%24,ny=cur==23?cy+1:cy;
const elapsed=Math.floor((now-st(cur,cy))/864e5)+1;
const total=Math.round((st(nx,ny)-st(cur,cy))/864e5);
const left=Math.max(1,Math.ceil((st(nx,ny)-now)/864e5));
const NS="http://www.w3.org/2000/svg";
const ring=$("ring");
const pos=i=>{const a=((i-23)*15+90)*Math.PI/180;return[160+135*Math.cos(a),160+135*Math.sin(a)]};
const dots=[];
for(let i=0;i<24;i++){
  const[x,y]=pos(i);
  const g=document.createElementNS(NS,"g");
  const h=document.createElementNS(NS,"circle");
  h.setAttribute("cx",x);h.setAttribute("cy",y);h.setAttribute("r",15);h.setAttribute("fill","transparent");
  const c=document.createElementNS(NS,"circle");
  c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("class","dot");
  g.appendChild(c);g.appendChild(h);g.style.cursor="pointer";
  g.addEventListener("click",()=>show(i));
  g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",T[i][0]);
  g.addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();show(i)}});
  const t=document.createElementNS(NS,"title");t.textContent=T[i][0];g.appendChild(t);
  ring.appendChild(g);dots.push(c);
}

// 二十四節氣詩畫：以詩詞、作者與短箋，呈現每個節氣的自然意境。
const POEMS = [
 ["小寒連大呂，歡鵲壘新巢。","元稹〈小寒十二月節〉","寒意尚深，枝頭已傳來築巢的消息。冬天的深處，生命正悄悄準備下一個春天。","冬藏・候春"],
 ["千山鳥飛絕，萬徑人蹤滅。","柳宗元〈江雪〉","天地安靜下來，山川收起聲音。大寒不只是寒冷，也是萬物蓄藏、等待轉暖的時刻。","歲暮・靜寂"],
 ["律回歲晚冰霜少，春到人間草木知。","張栻〈立春偶成〉","冰霜漸退，草木先知。春天不是突然來到，而是從枝梢與泥土裡慢慢醒來。","迎春・萌發"],
 ["竹外桃花三兩枝，春江水暖鴨先知。","蘇軾〈惠崇春江晚景〉","春水漸暖，桃花初綻。江上的鴨子，比人更早感受到春天的腳步。","春水・知暖"],
 ["微雨眾卉新，一雷驚蟄始。","韋應物〈觀田家〉","一聲春雷，喚醒蟄伏的生命。細雨落下，草木抽芽，大地重新有了聲息。","春雷・甦醒"],
 ["仲春初四日，春色正中分。","徐鉉〈春分日〉","晝夜平分，春意正好。花開與風暖之間，是一年最從容的平衡。","平分・和煦"],
 ["清明時節雨紛紛，路上行人欲斷魂。","杜牧〈清明〉","細雨、遠路與思念交織。清明既是春日踏青，也是記得來處、緬懷故人的日子。","煙雨・追思"],
 ["穀雨春光曉，山川黛色青。","元稹〈詠廿四氣詩·穀雨三月中〉","雨潤百穀，山色轉青。春天走到尾聲，田野正迎接蓬勃的生長。","春末・潤物"],
 ["四時天氣促相催，一夜薰風帶暑來。","翁卷〈立夏〉","風裡添了暖意，樹影也漸漸濃密。夏天在不知不覺間接手了春天。","入夏・風暖"],
 ["夜鶯啼綠柳，皓月醒長空。","歐陽修〈採桑子〉","綠柳深深，夜色清朗。小滿時節，萬物將滿未滿，留一點餘地，恰是好光景。","將滿・留白"],
 ["時雨及芒種，四野皆插秧。","陸游〈時雨〉","雨水落在田間，農人忙著插秧。芒種提醒人們，時節到了，就要把握耕耘的時機。","忙種・耕耘"],
 ["晝晷已云極，宵漏自此長。","韋應物〈夏至避暑北池〉","白晝走到一年最長，從此日影漸短。盛夏的光亮裡，也藏著季節轉身的訊息。","日長・陰生"],
 ["倏忽溫風至，因循小暑來。","元稹〈小暑六月節〉","熱風輕輕吹來，蟬聲漸密。暑氣初起，生活也該放慢一些。","初暑・蟬鳴"],
 ["赤日幾時過，清風無處尋。","曾幾〈大暑〉","烈日當空，暑氣正盛。越是炎熱，越懂得一縷清風的珍貴。","盛暑・尋涼"],
 ["乳鴉啼散玉屏空，一枕新涼一扇風。","劉翰〈立秋〉","暑意未退，風裡卻先有了涼。立秋像一封短箋，提醒人們季節已悄悄改變。","新秋・微涼"],
 ["離離暑雲散，裊裊涼風起。","白居易〈早秋曲江感懷〉","暑雲漸散，涼風漸起。處暑不是一夜入秋，而是熱意慢慢退場。","暑退・風起"],
 ["蒹葭蒼蒼，白露為霜。","《詩經·秦風·蒹葭》","水岸蘆葦蒼蒼，清露凝白。秋意在晨光裡顯現，也讓思念有了清冷的形狀。","清露・秋思"],
 ["金氣秋分，風清露冷秋期半。","謝逸〈點絳唇〉","秋分平分晝夜，天高而氣清。收穫與沉靜，在這一天相互照映。","秋半・清朗"],
 ["空庭得秋長漫漫，寒露入暮愁衣單。","王安石〈八月十九日試院夢衝卿〉","夜色漸涼，露水更重。寒露提醒人們添衣，也提醒心事不必總說出口。","深秋・添衣"],
 ["月落烏啼霜滿天，江楓漁火對愁眠。","張繼〈楓橋夜泊〉","霜夜、鐘聲與江上漁火，讓秋天有了深遠的回音。","霜夜・江楓"],

function pv(i){
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),a=st(i,Y),dd=Math.round((a-t0)/864e5);
  const md=`${Y}年${a.getMonth()+1}月${a.getDate()}日`;
  if(dd>0)return `${md}　·　還有 ${dd} 天`;
  return `${md}　·　已過 ${-dd} 天　·　${Math.round((st(i,Y+1)-t0)/864e5)} 天後再臨`;
}
function musicSet(i,first){
  mi=i;if(!on)return;
  stopDrone();startDrone(rootOf(i));
  const t=AC.currentTime,g0=+$("vol").value;
  if(!first){mg.gain.cancelScheduledValues(t);mg.gain.setValueAtTime(mg.gain.value,t);mg.gain.linearRampToValueAtTime(g0*.25,t+.4);mg.gain.linearRampToValueAtTime(g0,t+2.2)}
  dg=Math.floor(Math.random()*5);nx0=t+(first?.3:.8);
  $("mus").textContent=`♪ ${EM[EL[i]].n}調　開`;
}
function loop(){
  if(!on)return;
  const k=EL[mi],e=EM[k],sc=SC5[e.n],root=rootOf(mi),sp=e.s*(.85+(mi%4)*.08);
  while(nx0<AC.currentTime+.8){
    if(Math.random()<e.p){
      dg=Math.max(0,Math.min(9,dg+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
      const f=root*Math.pow(2,sc[dg%5]/12)*(dg>=5?2:1);
      nt(f,nx0,e.s*3.2,e.w,e.v);
      if(k=="水"&&Math.random()<.5)nt(f*2,nx0+.02,e.s*2,"sine",e.v*.3);
      if(k=="土"&&Math.random()<.4)nt(root*Math.pow(2,sc[(dg+2)%5]/12),nx0,sp*4,"sine",e.v*.7);
    }
    nx0+=sp*(.8+Math.random()*.5);
  }
}
