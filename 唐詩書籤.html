<main class="app">
<section class="stage" aria-label="書籤預覽舞台">
<div class="header-bar"><div><h1>唐詩書籤</h1><p class="sub">水墨國畫配唐詩宋詞・小路_Joseph 工作室製作</p></div>

<div class="row"><span class="lb">書法字體</span><div class="chips grid-4" id="fs"></div></div>
<div class="row"><label class="lb" for="po">唐詩宋詞</label><select id="po"></select></div>
<div class="two"><div class="row"><label class="lb" for="ti">標題</label><input type="text" id="ti"></div><div class="row"><label class="lb" for="au">朝代・作者</label><input type="text" id="au"></div></div>
<div class="row"><label class="lb" for="ln">詩句（一行一句，可自行修改）</label><textarea id="ln"></textarea></div>
<div class="two"><div class="row"><label class="lb" for="to">贈予</label><input type="text" id="to" maxlength="8" placeholder="例如：知音"></div><div class="row"><label class="lb" for="se">印章（最多四字）</label><input type="text" id="se" maxlength="4" placeholder="例如：雅賞"></div></div>
<div class="row"><span class="lb">製作標記</span><div class="chips" id="cs"></div></div>
<div class="actions"><button class="c go" id="ex" type="button">匯出高清 PNG</button><div class="actions-sub"><button class="c" id="pr" type="button">列印 / 另存 PDF</button><button class="c" id="cp" type="button">複製詩句</button></div></div>
</aside></main>
<footer>唐詩書籤 · 小路_Joseph  工作室製作</footer>
