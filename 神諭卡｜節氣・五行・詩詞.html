<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神諭卡｜節氣・五行・詩詞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--el:#fcf9f2;--fg:#26231e;--mut:#6b6355;--bd:#dcd2c0;--ac:#b0523f;--tint:#000;--lift:12%;--sh:0 16px 36px -16px rgba(38,35,30,.22);--cb:#26231e;--cp:rgba(244,239,230,.08);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151411;--el:#201e1a;--fg:#ece6d9;--mut:#a39b8c;--bd:#3b372e;--tint:#fff;--lift:38%;--sh:0 18px 40px -14px rgba(0,0,0,.65);--cb:#1b1915;--cp:rgba(236,230,217,.06);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151411;--el:#201e1a;--fg:#ece6d9;--mut:#a39b8c;--bd:#3b372e;--tint:#fff;--lift:38%;--sh:0 18px 40px -14px rgba(0,0,0,.65);--cb:#1b1915;--cp:rgba(236,230,217,.06);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;--ink:color-mix(in srgb,var(--ac),var(--tint) var(--lift))}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:radial-gradient(900px 420px at 50% -6%,color-mix(in srgb,var(--ac) 14%,transparent),transparent) var(--bg);color:var(--fg);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.75;min-height:100vh;min-height:100dvh}
button{font:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top-nav{max-width:820px;margin:0 auto;padding:12px 20px 0;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.icon-btn{font-size:.85rem;color:var(--mut);background:var(--el);border:1px solid var(--bd);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.icon-btn:hover{color:var(--fg);border-color:var(--ac)}
main{max-width:820px;margin:0 auto;padding:12px 20px 56px;text-align:center}
.eye{font-family:Georgia,serif;font-size:.78rem;letter-spacing:.42em;color:var(--mut);text-transform:uppercase}
h1{font-weight:500;letter-spacing:.55em;margin:6px 0 0 .55em;font-size:2.05rem}
.orn{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--mut);margin:12px auto 24px;max-width:280px;font-size:.65rem}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bd),transparent)}
.sub{color:var(--mut);margin:0 0 24px;font-size:.95rem}
.hide{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:560px;margin:0 auto}
.tile{--c:var(--ac);color:var(--fg);background:var(--el);border:1px solid var(--bd);border-top:3.5px solid var(--c);border-radius:12px;padding:22px 14px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .25s,box-shadow .25s,border-color .25s}
@media(hover:hover){.tile:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--c)}}
.tile.mix{grid-column:1/-1;flex-direction:row;justify-content:center;gap:18px;padding:18px 20px}
.tile .g{font-size:2.7rem;color:var(--c);line-height:1.1;font-weight:500}
.tile b{font-weight:600;letter-spacing:.32em;margin-left:.32em;font-size:1.05rem}
.tile .e{font-family:Georgia,serif;font-size:.72rem;letter-spacing:.2em;color:var(--mut)}
.tile .d{font-size:.8rem;color:var(--mut)}
.bar{display:flex;align-items:center;justify-content:space-between;max-width:600px;margin:0 auto 10px}
.back{border:0;background:none;color:var(--mut);cursor:pointer;padding:10px 6px;min-height:44px}
.back:hover{color:var(--ink)}
#dt{font-weight:600;letter-spacing:.32em;margin:0 0 4px .32em;font-size:1.38rem;color:var(--ink)}
#q{width:100%;max-width:480px;font:inherit;font-size:1rem;padding:11px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--el);color:var(--fg);text-align:center}
#q:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.controls{display:flex;flex-direction:column;align-items:center;gap:14px;margin:16px 0 8px}
.seg{display:inline-flex;border:1px solid var(--ac);border-radius:999px;overflow:hidden;background:var(--el)}
.seg button{font-size:.9rem;border:0;background:none;color:var(--ink);padding:10px 18px;min-height:44px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.toggle-lbl{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.88rem;color:var(--mut);min-height:36px}
.toggle-lbl input{accent-color:var(--ac);width:16px;height:16px}
.go{font-weight:600;font-size:1rem;letter-spacing:.45em;border:0;background:var(--ac);color:#fff;padding:12px 42px 12px 46px;min-height:46px;border-radius:999px;cursor:pointer;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--ac) 65%,transparent)}
.go:active{transform:translateY(1px)}
#row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.slot{width:220px;max-width:100%;perspective:1100px}
.pos{font-size:.85rem;color:var(--mut);letter-spacing:.32em;margin-bottom:10px;font-weight:500}
.card-wrap{aspect-ratio:2/3;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.22,1,.36,1);cursor:pointer;animation:dealIn .55s cubic-bezier(.2,.8,.2,1) backwards;border-radius:14px}
.card-wrap.flipped{transform:rotateY(180deg)}
@keyframes dealIn{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;box-shadow:var(--sh)}
.card-back{background:var(--cb);border:1px solid color-mix(in srgb,var(--ac) 50%,var(--bd));padding:10px;display:flex;color:color-mix(in srgb,var(--ac) 60%,#e6dec8)}
.card-back-inner{width:100%;height:100%;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:repeating-linear-gradient(45deg,var(--cp) 0 2px,transparent 2px 10px)}
.card-back-symbol{width:44px;height:44px;border:1px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--cb)}
.card-back-hint{font-size:.78rem;letter-spacing:.25em}
.card-front{transform:rotateY(180deg);border:1.5px solid var(--ac);background:var(--el);padding:9px}
.inner{height:100%;border:1px solid var(--bd);border-radius:8px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.art{width:100%;aspect-ratio:5/3;background:color-mix(in srgb,var(--ac) 11%,var(--el));border-radius:6px;color:var(--ink);overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.nm{font-size:1.85rem;letter-spacing:.28em;margin:6px 0 0 .28em;color:var(--ink);font-weight:600;line-height:1.3}
.img{font-size:.84rem;color:var(--mut)}
.kw{font-size:.96rem;letter-spacing:.38em;margin-left:.38em;font-weight:600}
.tag{margin-top:auto;font-size:.76rem;letter-spacing:.22em;color:var(--ink);border:1px solid var(--ac);border-radius:999px;padding:1px 12px}
.seal{position:absolute;top:14px;right:14px;width:24px;height:24px;background:var(--ac);color:#fff;font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:4px}
.rev .art svg,.rev .nm{transform:rotate(180deg)}
.flipnote{margin-top:14px;font-size:.85rem;color:var(--mut)}
.read{max-width:600px;margin:30px auto 0;text-align:left;background:var(--el);border:1px solid var(--bd);border-radius:14px;padding:22px 24px;box-shadow:var(--sh);animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.read h3{font-weight:600;letter-spacing:.32em;font-size:1.05rem;margin:0 0 8px;color:var(--ink)}
.qq{font-size:.96rem;padding:8px 12px;margin-bottom:8px;background:color-mix(in srgb,var(--ac) 7%,transparent);border-radius:8px}
.r{padding:14px 0;border-bottom:1px dashed var(--bd)}
.r b{color:var(--ink);display:block;font-weight:600;font-size:1.02rem;margin-bottom:3px}
.r .si{font-size:.84rem;color:var(--mut);margin-bottom:4px}
.rel,.sum{margin:10px 0;padding:10px 14px;border-left:3px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:0 8px 8px 0;font-size:.92rem}
.sum{margin-top:14px}
.act{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.act button{font-size:.9rem;border:1px solid var(--ac);background:none;color:var(--ink);border-radius:999px;padding:10px 22px;min-height:44px;cursor:pointer}
.act button:hover{background:var(--ac);color:#fff}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,14,12,.58);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--el);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:680px;max-height:84vh;max-height:84dvh;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.modal-head{padding:12px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:1.1rem;letter-spacing:.25em}
.modal-close{font-size:1.5rem;line-height:1;background:none;border:0;color:var(--mut);cursor:pointer;min-width:44px;min-height:44px}
.modal-tabs{display:flex;gap:8px;padding:8px 22px 0;border-bottom:1px solid var(--bd);overflow-x:auto}
.modal-tab{font-size:.9rem;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 12px;min-height:44px;cursor:pointer;white-space:nowrap}
.modal-tab.on{color:var(--fg);border-bottom-color:var(--ac);font-weight:600}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1}
.dict-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dict-item,.hist-item{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;background:var(--bg)}
.hist-item{margin-bottom:12px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.dh b{font-size:1.05rem;letter-spacing:.15em;color:var(--ink)}
.dh span,.hm{font-size:.8rem;color:var(--mut)}
.dict-item p{margin:4px 0 0;font-size:.86rem;line-height:1.55}
.hm{display:flex;justify-content:space-between;margin-bottom:6px}
.hq{font-weight:600;font-size:.92rem;margin-bottom:6px}
.foot{margin-top:44px;color:var(--mut);font-size:.78rem;letter-spacing:.08em}
.credit{margin-top:10px;font-size:.8rem;letter-spacing:.3em;text-indent:.3em}
@media(max-width:520px){
.tiles{grid-template-columns:1fr}
.slot{width:195px}
.read{padding:18px 16px}
#row.t3{flex-wrap:nowrap;gap:8px}
.t3 .slot{width:auto;flex:1 1 0;min-width:0}
.t3 .pos{font-size:.74rem;letter-spacing:.1em}
.t3 .inner{padding:6px 4px;gap:3px}
.t3 .nm{font-size:1.1rem;letter-spacing:.06em;margin-left:.06em}
.t3 .img,.t3 .seal,.t3 .card-back-hint{display:none}
.t3 .kw{font-size:.8rem;letter-spacing:.12em;margin-left:.12em}
.t3 .tag{font-size:.66rem;padding:0 7px;letter-spacing:.1em}
.t3 .card-back-symbol{width:34px;height:34px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav class="top-nav">
<button class="icon-btn" id="btn-dict">📖 牌義總覽</button>
<button class="icon-btn" id="btn-hist">🕰️ 抽牌紀錄</button>

<main>
<div class="eye">ORACLE DECK</div>
<h1>神諭卡</h1>
<div class="orn">◆</div>
<div id="home">

</div>

<div id="row"></div>

<div class="read hide" id="read" aria-live="polite"></div>
</div>
<div class="foot">僅供自我省思與心靈對話參考，重大決定請多方評估<div class="credit">小路工作室製作</div></div>
</main>
<div class="modal-backdrop hide" id="modal-bg">

<div class="modal-tabs hide" id="modal-tabs"></div>
<div class="modal-body" id="modal-body"></div>
</div>
</div>

["秋分","晝夜再分","衡量","再次權衡，取捨得宜。","猶豫不決，天平久懸。"],
["寒露","露寒欲霜","警覺","提早準備，防患未然。","過度憂慮，把風當成霜。"],

var W=[
["春芽","木·破土","萌發","新計畫正在冒頭，給它空間。","嫩芽被踩踏，保護初生的想法。","#4a7f4e"],
