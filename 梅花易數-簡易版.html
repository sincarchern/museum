<main>
<div class="eyebrow">MEIHUA YISHU・NUMBER DIVINATION</div><h1>梅花易數</h1>

<div class="panel"><div class="in">
<input id="a" type="number" inputmode="numeric" min="1" placeholder="第一個數" aria-label="第一個數字">
<input id="b" type="number" inputmode="numeric" min="1" placeholder="第二個數" aria-label="第二個數字">
</div>
<div class="btns"><button id="go">起卦</button><button id="rnd">隨機</button></div>

<div id="out" aria-live="polite"></div>
<footer>僅供文化娛樂與自我省思，不構成任何決策建議。<br>小路・梅花易數</footer>
</main>

 else if(SHENG[ye]==te)v="用生體，外力相助，偏吉。";
 else if(KE[te]==ye)v="體剋用，可掌控，次吉。";
 else if(SHENG[te]==ye)v="體生用，耗力付出，偏耗。";
 else v="用剋體，阻力較大，宜謹慎。";
 var h='<div class="row">'+card("本卦",ls,up,lo,mv,"動爻：第"+(mv+1)+"爻")+card("互卦",[].concat(L[hl],L[hu]),hu,hl,-1,"看過程")+card("變卦",c,bu,bl,-1,"看結果")+'</div>';
 h+='<div class="tiyong"><p><span class="tag">體</span> '+N[ti]+'（'+te+'）　<span class="tag">用</span> '+N[yg]+'（'+ye+'）</p><p>'+v+'</p></div>';
 var r1=rel(hu,te),r2=rel(hl,te),bx=tiU?bu:bl,r3=rel(bx,te);
 var proc=r1[1]+r2[1]>=4?"過程大致順暢":r1[1]+r2[1]>=3?"過程有起伏":"過程多阻";
 var endt=r3[1]>=2?"結果向好":r3[1]==1?"結果偏耗，需付出代價":"結果不利，宜保守";
 var bn=T[lo][up],cn=T[bl][bu];
 h+='<div class="guaci"><p class="tag">卦辭・本卦'+FN[bn]+'</p><p class="ci">'+GC[bn]+'</p>'+(cn!=bn?'<p class="tag">卦辭・變卦'+FN[cn]+'</p><p class="ci">'+GC[cn]+'</p>':'')+'</div>';
 h+='<div class="guaci"><p class="tag">斷語</p><p class="kv"><span>起始</span><em style="font-style:normal">'+v+'</em></p><p class="kv"><span>過程</span><em style="font-style:normal">互卦'+N[hu]+'、'+N[hl]+'對體為「'+r1[0]+'」「'+r2[0]+'」，'+proc+'。</em></p><p class="kv"><span>結果</span><em style="font-style:normal">變卦'+N[bx]+'對體為「'+r3[0]+'」，'+endt+'。</em></p><p class="note">斷語由體用五行生剋規則推算，未計入季節旺衰與外應，請當作自我省思的參考。</p></div>';
 var s0=rel(yg,te);
 var adv=s0[1]>=2&&r3[1]>=2?'整體順勢，可積極行動，但仍守卦義所示的分寸。':s0[1]>=2?'起手順利、後段轉弱，宜早收尾，避免戰線拖長。':r3[1]>=2?'起步較辛苦、後續轉佳，宜堅持度過初期。':'整體阻力偏多，宜保守觀望，先做準備、等待時機。';
 h+='<div class="guaci"><p class="tag">詳細解讀</p>'+E('卦義','本卦'+FN[bn]+'：'+GY[bn]+'。'+(cn!=bn?'變卦'+FN[cn]+'：'+GY[cn]+'。':''))+E('爻位','動爻在第'+(mv+1)+'爻，'+YP[mv])+E('體象','體卦'+N[ti]+'（'+GX[ti]+'），代表自己或所問之事的主體。')+E('用象','用卦'+N[yg]+'（'+GX[yg]+'），代表外在環境、對方或事情的走向。對體為「'+s0[0]+'」：'+RX[s0[0]]+'。')+E('過程','互卦上'+N[hu]+'為「'+r1[0]+'」、下'+N[hl]+'為「'+r2[0]+'」。'+proc+'；'+RX[r1[0]]+'，且'+RX[r2[0]]+'。')+E('結果','變卦'+N[bx]+'對體為「'+r3[0]+'」：'+RX[r3[0]]+'。'+endt+'。')+E('建議',adv)+'</div>';
 h+='<p class="calc">'+a+' ÷ 8 餘 '+(a%8)+'，取上卦'+N[up]+'；'+b+' ÷ 8 餘 '+(b%8)+'，取下卦'+N[lo]+'；('+a+'+'+b+') ÷ 6 餘 '+((a+b)%6)+'，動爻第'+(mv+1)+'爻。餘 0 取滿數。</p>';
 return h;
}
var A=document.getElementById("a"),B=document.getElementById("b"),O=document.getElementById("out"),H=document.getElementById("hint");
function run(){
 var a=parseInt(A.value,10),b=parseInt(B.value,10);
 if(!(a>0)||!(b>0)){H.textContent="請輸入兩個大於 0 的整數。";O.innerHTML="";return}
 H.textContent="";O.innerHTML=cast(a,b);
}
document.getElementById("go").onclick=run;
document.getElementById("rnd").onclick=function(){A.value=1+Math.floor(Math.random()*99);B.value=1+Math.floor(Math.random()*99);run()};
[A,B].forEach(function(e){e.addEventListener("keydown",function(k){if(k.key==="Enter")run()})});
